name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule: [{ cron: '17 3 * * 1' }]
permissions: { contents: read }
concurrency: { group: 'ci-${{ github.workflow }}-${{ github.ref }}', cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24.18.0, package-manager-cache: false }
      - run: corepack enable pnpm && corepack prepare pnpm@11.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-action-shas.mjs
      - run: pnpm verify
